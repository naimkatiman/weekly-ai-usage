name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: Installer version to build and verify
        required: true
        default: 0.2.0-preview.1
permissions:
  contents: read
env:
  PACKAGE_VERSION: ${{ inputs.version || format('0.2.0-ci.{0}', github.run_number) }}
jobs:
  test:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
      - name: Test collector and account configuration
        run: powershell -NoProfile -ExecutionPolicy Bypass -File test.ps1
      - name: Build Windows dashboard
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1
      - name: Package Windows installer with bundled runtime
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer.ps1 -Version "$env:PACKAGE_VERSION"
      - name: Verify installation, bundled runtime, upgrade and uninstall
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer.test.ps1 -InstallerPath "dist/WeeklyAIUsage-${env:PACKAGE_VERSION}-Setup-x64.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-ai-usage-installer
          path: |
            dist/*-Setup-x64.exe
            dist/*-Setup-x64.exe.sha256
          if-no-files-found: error
